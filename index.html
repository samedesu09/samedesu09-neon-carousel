<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dashboard</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060309">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background-color: #060309; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
  }
  
  /* アンビエント照明 */
  .ambient-bg {
    position: absolute; top: -15%; left: -15%; width: 130%; height: 130%;
    object-fit: cover; filter: blur(80px) brightness(0.15) saturate(1.2);
    opacity: 0.8; z-index: 1; display: none; transition: opacity 0.8s;
  }
  #heart-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* 3D カルーセル */
  .carousel-stage {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px; z-index: 5; transition: height 0.4s;
  }
  .carousel-cylinder, .carousel-panel { transform-style: preserve-3d; position: absolute; }
  .panel-face {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 14px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 42, 109, 0.25);
    box-shadow: inset 0 0 15px rgba(255, 42, 109, 0.08), 0 8px 30px rgba(0, 0, 0, 0.5);
    background: rgba(18, 10, 24, 0.15); backdrop-filter: blur(2px); overflow: hidden; padding: 8px;
    transition: all 0.3s;
  }
  /* フレームOFF時のスタイル */
  .panel-face.hide-frame {
    border: none !important;
    box-shadow: none !important;
    background: transparent !important;
    backdrop-filter: none !important;
  }

  .panel-front { z-index: 2; transform: rotateY(0deg); }
  .panel-front img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }
  .panel-back { transform: rotateY(180deg); opacity: 0.4; filter: brightness(0.7); }
  .panel-back img { max-width: 100%; max-height: 100%; object-fit: contain; transform: scaleX(-1); }
  
  .panel-empty {
    width: 100%; height: 100%; border-radius: 14px; background: rgba(18, 10, 24, 0.4);
    backdrop-filter: blur(8px); border: 2px dashed rgba(255, 42, 109, 0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; cursor: pointer; transition: all 0.3s;
  }
  .panel-empty:hover { border-color: #ff2a6d; background: rgba(255, 42, 109, 0.12); transform: scale(1.02); }
  .panel-empty-icon { width: 44px; height: 44px; filter: drop-shadow(0 0 10px #ff2a6d); }
  .panel-empty-text { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em; color: #ff758c; text-shadow: 0 0 8px rgba(255, 42, 109, 0.8); }

  /* 時計 UI */
  .overlay-clock {
    position: absolute; z-index: 10; text-shadow: 0 0 12px rgba(255, 42, 109, 0.6);
    transition: all 0.5s ease; pointer-events: none;
  }
  .pos-tl { top: 28px; left: 36px; text-align: left; }
  .pos-tc { top: 28px; left: 50%; transform: translateX(-50%); text-align: center; }
  .pos-tr { top: 28px; right: 36px; text-align: right; }
  .pos-bl { bottom: 28px; left: 36px; text-align: left; }
  .pos-bc { bottom: 28px; left: 50%; transform: translateX(-50%); text-align: center; }
  .pos-br { bottom: 28px; right: 90px; text-align: right; }

  .clock-time { font-weight: 200; letter-spacing: 0.08em; line-height: 1.1; }
  .clock-date { font-weight: 300; letter-spacing: 0.25em; opacity: 0.7; margin-top: 4px; }

  /* 横長下部カレンダーウィジェット */
  .bottom-calendar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 96%; max-width: 1000px; padding: 12px 18px;
    background: rgba(12, 8, 16, 0.6); backdrop-filter: blur(12px);
    border: 1px solid rgba(181, 55, 242, 0.25); border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 15px rgba(181, 55, 242, 0.05);
    z-index: 9; transition: transform 0.5s ease, opacity 0.5s ease;
  }
  .bcal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .bcal-nav { background: transparent; border: none; color: #b537f2; font-size: 1.2rem; cursor: pointer; padding: 0 15px; }
  .bcal-nav:hover { text-shadow: 0 0 12px #d066ff; color: #d066ff; }
  .bcal-ym { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 8px rgba(181, 55, 242, 0.5); }
  
  .bcal-row { display: flex; justify-content: stretch; gap: 6px; margin-bottom: 6px; width: 100%; }
  .bcal-cell {
    flex: 1; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 0; text-align: center;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; border: 1px solid transparent;
    transition: 0.2s; min-height: 54px;
  }
  .bcal-cell:hover { background: rgba(181, 55, 242, 0.15); border-color: #b537f2; }
  .bcal-cell.today { border-color: #d066ff; background: rgba(181, 55, 242, 0.25); box-shadow: inset 0 0 10px rgba(181, 55, 242, 0.3); }
  .bcal-date { font-size: 0.95rem; font-weight: bold; }
  .bcal-dow { font-size: 0.6rem; color: #a49ea8; margin-top: -2px; }
  .bcal-marks { display: flex; gap: 2px; justify-content: center; height: 14px; margin-top: 2px; font-size: 0.7rem; filter: drop-shadow(0 0 4px rgba(255,255,255,0.5)); }

  /* 3連ネオンハートボタン */
  .heart-group { position: fixed; bottom: 26px; right: 28px; z-index: 100; display: flex; flex-direction: column; gap: 16px; transition: opacity 0.4s; }
  .heart-btn { width: 38px; height: 38px; cursor: pointer; transition: transform 0.3s, filter 0.3s; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)); }
  .heart-btn:hover { transform: scale(1.15); }
  .btn-main svg { fill: rgba(255, 42, 109, 0.15); stroke: #ff2a6d; }
  .btn-main:hover { filter: drop-shadow(0 0 14px #ff2a6d); }
  .btn-cal svg { fill: rgba(181, 55, 242, 0.15); stroke: #b537f2; }
  .btn-cal:hover { filter: drop-shadow(0 0 14px #b537f2); }
  .btn-sch svg { fill: rgba(0, 230, 255, 0.15); stroke: #00e6ff; }
  .btn-sch:hover { filter: drop-shadow(0 0 14px #00e6ff); }
  
  .ui-hidden { opacity: 0 !important; pointer-events: none; transform: scale(0.95) translateY(20px); }

  /* ガラスパネル */
  .glass-panel {
    position: fixed; top: 0; right: 0; width: 340px; height: 100vh;
    background: rgba(12, 8, 16, 0.96); backdrop-filter: blur(16px);
    border-left: 1px solid rgba(255, 255, 255, 0.1); z-index: 150;
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; padding: 24px 20px; gap: 18px; overflow-y: auto;
  }
  .glass-panel.is-open { transform: translateX(0); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
  .panel-title { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em; }
  .t-main { color: #ff2a6d; } .t-cal { color: #b537f2; } .t-sch { color: #00e6ff; }
  .close-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }
  
  .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 5px; }
  .label { font-size: 0.68rem; color: #8a8190; letter-spacing: 0.1em; text-transform: uppercase; }
  
  .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pos-btn { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #aaa; padding: 8px 0; border-radius: 4px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; }
  .pos-btn.active { background: rgba(255, 42, 109, 0.2); border-color: #ff2a6d; color: #fff; box-shadow: 0 0 10px rgba(255, 42, 109, 0.4); }
  .pos-btn.cal-active { background: rgba(181, 55, 242, 0.2); border-color: #b537f2; color: #fff; box-shadow: 0 0 10px rgba(181, 55, 242, 0.4); }

  .btn-outline-pink { display: block; width: 100%; padding: 10px; background: rgba(255,42,109,0.1); border: 1px dashed #ff2a6d; color: #ff758c; border-radius: 6px; cursor: pointer; font-size: 0.75rem; text-align: center; }
  .btn-outline-red { display: block; width: 100%; padding: 8px; background: rgba(255,75,75,0.1); border: 1px solid #ff4b4b; color: #ff8080; border-radius: 6px; cursor: pointer; font-size: 0.75rem; text-align: center; }

  select, input[type="text"], input[type="date"], input[type="time"] {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 42, 109, 0.4);
    border-radius: 6px; color: #fff; font-size: 0.85rem; outline: none; color-scheme: dark; transition: box-shadow 0.3s;
  }
  .input-sch { border-color: #00e6ff !important; }
  .input-sch:focus { box-shadow: 0 0 12px #00e6ff !important; }
  
  #sch-mark { text-align: center; font-size: 1.5rem; letter-spacing: 0; padding: 4px; width: 60px; }

  input[type="range"] { appearance: none; width: 100%; height: 4px; background: #231929; border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff2a6d; box-shadow: 0 0 6px #ff2a6d; }

  .btn-submit {
    padding: 12px; background: rgba(0, 230, 255, 0.15); border: 1px solid #00e6ff; color: #00e6ff;
    border-radius: 6px; cursor: pointer; font-weight: bold; letter-spacing: 0.1em; transition: 0.3s; text-align: center;
  }
  .btn-submit:hover { background: #00e6ff; color: #000; box-shadow: 0 0 15px #00e6ff; }

  .sch-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: rgba(0,0,0,0.3); border-radius: 4px; margin-bottom: 6px; border-left: 3px solid #00e6ff; }
  .sch-mark { font-size: 1rem; margin-right: 8px; filter: drop-shadow(0 0 4px rgba(255,255,255,0.5)); }
  .sch-time { font-size: 0.7rem; color: #00e6ff; width: 45px;}
  .sch-title { font-size: 0.8rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-del { font-size: 0.7rem; color: #ff4b4b; cursor: pointer; background:none; border:none; padding-left:10px; }
</style>
</head>
<body>

<img src="" class="ambient-bg" id="ambient-bg">
<canvas id="heart-canvas"></canvas>

<!-- 画像カルーセル -->
<div class="carousel-stage" id="carousel-stage">
  <div class="carousel-cylinder" id="carousel-cylinder"></div>
</div>

<!-- 時計 -->
<div class="overlay-clock pos-tr" id="clock-container">
  <div class="clock-time" id="clock-time" style="font-size: 3rem;">00:00</div>
  <div class="clock-date" id="clock-date" style="font-size: 0.8rem;">2026.09.09 WED</div>
</div>

<!-- 横長下部カレンダー (デフォルト非表示に設定) -->
<div class="bottom-calendar" id="calendar-widget" style="display: none;">
  <div class="bcal-header">
    <button class="bcal-nav" onclick="changeMonth(-1)">＜</button>
    <div class="bcal-ym" id="cal-ym">2026.09</div>
    <button class="bcal-nav" onclick="changeMonth(1)">＞</button>
  </div>
  <div id="cal-grid"></div>
</div>

<!-- 3連ハートボタン -->
<div class="heart-group" id="heart-group">
  <div class="heart-btn btn-sch" onclick="openPanel('panel-schedule')" title="Schedule Manager">
    <svg viewBox="0 0 32 32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28 C16 28 3 19 3 10 C3 5 7 2 11.5 2 C14.3 2 15.6 3.5 16 4.5 C16.4 3.5 17.7 2 20.5 2 C25 2 29 5 29 10 C29 19 16 28 16 28 Z"/></svg>
  </div>
  <div class="heart-btn btn-cal" onclick="openPanel('panel-calendar')" title="Calendar Settings">
    <svg viewBox="0 0 32 32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28 C16 28 3 19 3 10 C3 5 7 2 11.5 2 C14.3 2 15.6 3.5 16 4.5 C16.4 3.5 17.7 2 20.5 2 C25 2 29 5 29 10 C29 19 16 28 16 28 Z"/></svg>
  </div>
  <div class="heart-btn btn-main" onclick="openPanel('panel-main')" title="Main Settings">
    <svg viewBox="0 0 32 32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28 C16 28 3 19 3 10 C3 5 7 2 11.5 2 C14.3 2 15.6 3.5 16 4.5 C16.4 3.5 17.7 2 20.5 2 C25 2 29 5 29 10 C29 19 16 28 16 28 Z"/></svg>
  </div>
</div>

<input type="file" id="image-file-input" accept="image/*" multiple style="display: none;">

<!-- パネル1: メイン設定 (Pink) -->
<div class="glass-panel" id="panel-main">
  <div class="panel-header"><div class="panel-title t-main">MAIN SETTINGS</div><button class="close-btn" onclick="closePanels()">✕</button></div>
  <div class="control-group">
    <div class="label">Image Source</div>
    <button onclick="document.getElementById('image-file-input').click()" class="btn-outline-pink">＋ 画像を追加 (複数選択可)</button>
    <button onclick="resetAllImages()" class="btn-outline-red">🗑 全ての画像をリセット</button>
  </div>
  <!-- ★追加：画像フレームのON/OFF切り替え -->
  <div class="control-group">
    <div class="label">Image Frame (画像枠)</div>
    <div class="pos-grid" style="grid-template-columns: 1fr 1fr;">
      <button class="pos-btn active" id="btn-frame-on" onclick="toggleFrame(true)">ON</button>
      <button class="pos-btn" id="btn-frame-off" onclick="toggleFrame(false)">OFF</button>
    </div>
  </div>
  <div class="control-group">
    <div class="label">Rotation Direction</div>
    <div class="pos-grid" style="grid-template-columns: 1fr 1fr;">
      <button class="pos-btn active" id="btn-dir-right" onclick="setDirection(1)">右から左 ◀</button>
      <button class="pos-btn" id="btn-dir-left" onclick="setDirection(-1)">左から右 ▶</button>
    </div>
  </div>
  <div class="control-group">
    <div class="label">Rotation Speed</div>
    <input type="range" id="speed-range" min="5" max="40" value="15">
  </div>
  <div class="control-group">
    <div class="label">Carousel Radius</div>
    <input type="range" id="radius-range" min="300" max="850" value="480">
  </div>
  <div class="control-group" style="margin-top: 10px;">
    <div class="label">Clock Position</div>
    <div class="pos-grid" id="clock-pos-grid">
      <button class="pos-btn" data-pos="pos-tl">左上</button><button class="pos-btn" data-pos="pos-tc">上中</button><button class="pos-btn active" data-pos="pos-tr">右上</button>
      <button class="pos-btn" data-pos="pos-bl">左下</button><button class="pos-btn" data-pos="pos-bc">下中</button><button class="pos-btn" data-pos="pos-br">右下</button>
    </div>
  </div>
  <div class="control-group">
    <div class="label">Time Zone</div>
    <select id="tz-select">
      <option value="Asia/Tokyo">Tokyo (JST)</option>
      <option value="America/New_York">New York (EST)</option>
      <option value="Europe/London">London (GMT)</option>
      <option value="UTC">UTC</option>
    </select>
  </div>
</div>

<!-- パネル2: カレンダー設定 (Purple) -->
<div class="glass-panel" id="panel-calendar">
  <div class="panel-header"><div class="panel-title t-cal">CALENDAR SETTINGS</div><button class="close-btn" onclick="closePanels()">✕</button></div>
  <div class="control-group">
    <div class="label">カレンダー表示 / 非表示</div>
    <div class="pos-grid" style="grid-template-columns: 1fr 1fr;">
      <button class="pos-btn" id="btn-cal-show" onclick="toggleCalendarVisibility(true)">表示する</button>
      <button class="pos-btn cal-active" id="btn-cal-hide" onclick="toggleCalendarVisibility(false)">隠す</button>
    </div>
    <div style="font-size:0.65rem; color:#888; margin-top:4px;">※表示中は画像が重ならないよう自動で上にズレます。</div>
  </div>
</div>

<!-- パネル3: 予定管理 (Cyan) -->
<div class="glass-panel" id="panel-schedule">
  <div class="panel-header"><div class="panel-title t-sch">SCHEDULE MANAGER</div><button class="close-btn" onclick="closePanels()">✕</button></div>
  
  <div id="sch-list-display"></div>
  <hr style="border:0; border-top:1px dashed rgba(0,230,255,0.3); margin: 15px 0;">
  
  <!-- 新規予定登録 -->
  <div class="control-group" style="flex-direction:row; justify-content:space-between; align-items:flex-end;">
    <div style="flex: 1; padding-right:10px;">
      <div class="label">DATE (日付)</div>
      <input type="date" id="sch-date" class="input-sch">
    </div>
    <div style="width: 70px;">
      <div class="label">MARK</div>
      <input type="text" id="sch-mark" class="input-sch" value="🔴" maxlength="2" placeholder="🔴">
    </div>
  </div>
  <div class="control-group">
    <div class="label">TIME (時間)</div>
    <input type="time" id="sch-time" class="input-sch">
  </div>
  <div class="control-group">
    <div class="label">TITLE (予定内容)</div>
    <input type="text" id="sch-title" placeholder="Night drive..." class="input-sch">
  </div>
  <button class="btn-submit" onclick="saveSchedule()" style="margin-top:10px;">＋ 予定を登録</button>
</div>

<script>
  function getTodayStr() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  }

  /* --- データベース初期化 --- */
  const DB_NAME = 'NeonAppDB_New';
  let db;
  const initDB = () => new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('images')) database.createObjectStore('images', { keyPath: 'id' });
      if (!database.objectStoreNames.contains('schedules')) database.createObjectStore('schedules', { keyPath: 'id' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = () => { alert("DBのロードに失敗しました。"); resolve(); };
  });

  async function saveImagesToDB(imgs) {
    if(!db) return;
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').put({ id: 'saved_list', data: imgs });
  }
  async function loadImagesFromDB() {
    if(!db) return [];
    return new Promise(resolve => {
      const tx = db.transaction('images', 'readonly');
      const req = tx.objectStore('images').get('saved_list');
      req.onsuccess = () => resolve(req.result ? req.result.data : []);
      req.onerror = () => resolve([]);
    });
  }
  async function clearImageDB() {
    if(!db) return;
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').clear();
  }

  /* --- UI表示切替＆パネル（誤爆防止） --- */
  let uiVisible = true;
  let calendarVisible = false; // デフォルト非表示
  let isFrameOn = true; // 画像フレームの表示状態
  
  document.addEventListener('dblclick', (e) => {
    if (e.target.closest('.glass-panel') || e.target.closest('.bottom-calendar') || e.target.closest('.heart-group')) {
      return;
    }
    toggleUI();
  });

  function toggleUI() {
    uiVisible = !uiVisible;
    document.getElementById('clock-container').classList.toggle('ui-hidden', !uiVisible);
    document.getElementById('heart-group').classList.toggle('ui-hidden', !uiVisible);
    if (calendarVisible) {
      document.getElementById('calendar-widget').classList.toggle('ui-hidden', !uiVisible);
    }
    if (!uiVisible) closePanels();
  }
  function closePanels() { document.querySelectorAll('.glass-panel').forEach(p => p.classList.remove('is-open')); }
  function openPanel(id) { 
    closePanels(); 
    document.getElementById(id).classList.add('is-open'); 
    if(id === 'panel-schedule' && !document.getElementById('sch-date').value) {
      document.getElementById('sch-date').value = getTodayStr();
      showScheduleList(getTodayStr());
    }
  }

  function toggleCalendarVisibility(show) {
    calendarVisible = show;
    document.getElementById('btn-cal-show').classList.toggle('cal-active', show);
    document.getElementById('btn-cal-hide').classList.toggle('cal-active', !show);
    document.getElementById('calendar-widget').style.display = show ? 'block' : 'none';
    updateResponsiveLayout();
  }

  /* ★追加：画像フレームのON/OFF処理 */
  function toggleFrame(show) {
    isFrameOn = show;
    document.getElementById('btn-frame-on').classList.toggle('active', show);
    document.getElementById('btn-frame-off').classList.toggle('active', !show);
    document.querySelectorAll('.panel-face').forEach(el => {
      el.classList.toggle('hide-frame', !show);
    });
  }

  /* --- 予定管理処理 --- */
  let schedules = [];
  async function loadSchedules() {
    if(!db) return;
    return new Promise(resolve => {
      const tx = db.transaction('schedules', 'readonly');
      const req = tx.objectStore('schedules').getAll();
      req.onsuccess = () => { schedules = req.result || []; resolve(); };
    });
  }
  
  async function saveSchedule() {
    if(!db) { alert("データベースの準備中です。数秒待って再度お試しください。"); return; }
    
    const date = document.getElementById('sch-date').value;
    const time = document.getElementById('sch-time').value;
    const title = document.getElementById('sch-title').value;
    const mark = document.getElementById('sch-mark').value || '🔴';

    if (!date || !title) return alert("日付と内容を入力してください！");
    
    const id = Date.now().toString();
    const tx = db.transaction('schedules', 'readwrite');
    tx.objectStore('schedules').put({ id, date, time, title, mark });
    
    tx.oncomplete = async () => {
      await loadSchedules();
      renderCalendar();
      showScheduleList(date);
      document.getElementById('sch-title').value = '';
    };
    tx.onerror = (err) => { alert("保存に失敗しました。"); };
  }
  
  async function deleteSchedule(id, date) {
    const tx = db.transaction('schedules', 'readwrite');
    tx.objectStore('schedules').delete(id);
    tx.oncomplete = async () => { await loadSchedules(); renderCalendar(); showScheduleList(date); };
  }

  function showScheduleList(dateStr) {
    const list = schedules.filter(s => s.date === dateStr).sort((a,b) => (a.time||"").localeCompare(b.time||""));
    let html = `<div class="label" style="color:#00e6ff; margin-bottom:10px;">${dateStr.replace(/-/g, '.')} の予定リスト</div>`;
    if (list.length === 0) {
      html += `<div style="font-size:0.8rem; color:#888; text-align:center; margin: 20px 0;">予定はありません</div>`;
    } else {
      list.forEach(s => {
        html += `<div class="sch-item">
          <div class="sch-mark">${s.mark}</div>
          <div class="sch-time">${s.time || '終日'}</div>
          <div class="sch-title" title="${s.title}">${s.title}</div>
          <button class="sch-del" onclick="deleteSchedule('${s.id}', '${dateStr}')">✕</button>
        </div>`;
      });
    }
    document.getElementById('sch-list-display').innerHTML = html;
  }

  /* --- 3段Flexbox 横長カレンダー生成 --- */
  let currentMonth = new Date();
  const dowNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  function changeMonth(diff) { currentMonth.setMonth(currentMonth.getMonth() + diff); renderCalendar(); }

  function renderCalendar() {
    const y = currentMonth.getFullYear();
    const m = currentMonth.getMonth();
    document.getElementById('cal-ym').textContent = `${y}.${String(m+1).padStart(2,'0')}`;
    
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const gridDiv = document.getElementById('cal-grid');
    gridDiv.innerHTML = '';
    gridDiv.style.display = 'flex';
    gridDiv.style.flexDirection = 'column';
    
    const row1 = document.createElement('div'); row1.className = 'bcal-row';
    const row2 = document.createElement('div'); row2.className = 'bcal-row';
    const row3 = document.createElement('div'); row3.className = 'bcal-row';
    
    gridDiv.appendChild(row1);
    gridDiv.appendChild(row2);
    gridDiv.appendChild(row3);
    
    const today = new Date();

    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(y, m, d);
      const dowStr = dowNames[dateObj.getDay()];
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());
      
      const daySchs = schedules.filter(s => s.date === dateStr);
      let marksHtml = '';
      if(daySchs.length > 0) {
        marksHtml = daySchs.slice(0,3).map(s => `<span>${s.mark}</span>`).join('');
      }
      
      const cell = document.createElement('div');
      cell.className = `bcal-cell ${isToday ? 'today' : ''}`;
      cell.innerHTML = `
        <div class="bcal-date">${d}</div>
        <div class="bcal-dow">${dowStr}</div>
        <div class="bcal-marks">${marksHtml}</div>
      `;
      
      cell.onclick = () => {
        document.getElementById('sch-date').value = dateStr;
        showScheduleList(dateStr);
        openPanel('panel-schedule');
      };

      if (d <= 10) {
        row1.appendChild(cell);
      } else if (d <= 20) {
        row2.appendChild(cell);
      } else {
        row3.appendChild(cell);
      }
    }
  }

  /* --- 時計 --- */
  let currentTz = 'Asia/Tokyo';
  function updateClock() {
    const now = new Date();
    const optsTime = { timeZone: currentTz, hour: '2-digit', minute: '2-digit', hour12: false };
    const optsDate = { timeZone: currentTz, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' };
    document.getElementById('clock-time').textContent = new Intl.DateTimeFormat('en-US', optsTime).format(now);
    document.getElementById('clock-date').textContent = new Intl.DateTimeFormat('en-US', optsDate).format(now).toUpperCase().replace(/,/g, '');
  }
  setInterval(updateClock, 1000);
  document.getElementById('tz-select').addEventListener('change', (e) => { currentTz = e.target.value; updateClock(); });
  document.querySelectorAll('#clock-pos-grid .pos-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('#clock-pos-grid .pos-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('clock-container').className = `overlay-clock ${e.target.dataset.pos}`;
    });
  });

  /* --- カルーセル・背景処理 --- */
  const cylinder = document.getElementById('carousel-cylinder');
  const ambientBg = document.getElementById('ambient-bg');
  const fileInput = document.getElementById('image-file-input');
  const stage = document.getElementById('carousel-stage');
  let currentImages = [];
  let baseRadius = 480; let carouselRadius = 480; let rotationAngle = 0; let rotationDirection = 1; let rotationSpeed = 0.15;

  function buildCarousel() {
    cylinder.innerHTML = '';
    if (currentImages.length === 0) {
      ambientBg.style.display = 'none';
      for (let idx = 0; idx < 6; idx++) {
        const p = document.createElement('div'); p.className = 'carousel-panel';
        p.innerHTML = `<div class="panel-empty" onclick="document.getElementById('image-file-input').click()"><div class="panel-empty-text">＋ ADD PHOTO</div></div>`;
        cylinder.appendChild(p);
      }
    } else {
      ambientBg.src = currentImages[0]; ambientBg.style.display = 'block';
      let list = [...currentImages]; while (list.length < 6) list = list.concat(currentImages);
      list.forEach((src) => {
        const p = document.createElement('div'); p.className = 'carousel-panel';
        // ★isFrameOn の状態で hide-frame クラスをつけるか判定
        const frameClass = isFrameOn ? '' : 'hide-frame';
        p.innerHTML = `<div class="panel-face panel-front ${frameClass}"><img src="${src}"></div><div class="panel-face panel-back ${frameClass}"><img src="${src}"></div>`;
        cylinder.appendChild(p);
      });
    }
    updateResponsiveLayout();
  }

  function updateResponsiveLayout() {
    const w = window.innerWidth;
    const actualH = window.innerHeight;
    const availableH = calendarVisible ? actualH - 220 : actualH;
    stage.style.height = `${availableH}px`;
    
    let panelH = Math.round(Math.min(availableH * 0.6, 460));
    let panelW = Math.round(panelH * (320 / 440));
    if (panelW > w * 0.72) { panelW = Math.round(w * 0.72); panelH = Math.round(panelW * (440 / 320)); }
    
    cylinder.style.width = `${panelW}px`; cylinder.style.height = `${panelH}px`;
    const panels = cylinder.querySelectorAll('.carousel-panel');
    panels.forEach(p => { p.style.width = `${panelW}px`; p.style.height = `${panelH}px`; });
    
    carouselRadius = Math.min(baseRadius, Math.max(160, Math.round(w * 0.38)));
    stage.style.perspective = `${Math.max(650, Math.round(w * 1.0))}px`;
    
    if (panels.length > 0) {
      const step = 360 / panels.length;
      panels.forEach((p, idx) => { p.style.transform = `rotateY(${step * idx}deg) translateZ(${carouselRadius}px)`; });
    }
  }

  function animateCarousel() {
    rotationAngle += rotationSpeed * rotationDirection;
    cylinder.style.transform = `rotateY(${rotationAngle}deg)`;
    requestAnimationFrame(animateCarousel);
  }
  requestAnimationFrame(animateCarousel);

  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length > 0) {
      currentImages = []; let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          currentImages.push(ev.target.result); loaded++;
          if (loaded === files.length) { saveImagesToDB(currentImages); buildCarousel(); }
        };
        reader.readAsDataURL(file);
      });
    }
  });

  async function resetAllImages() {
    if (confirm('登録した画像をすべてリセットしますか？')) { await clearImageDB(); currentImages = []; fileInput.value = ''; buildCarousel(); }
  }
  function setDirection(dir) { rotationDirection = dir; document.getElementById('btn-dir-right').classList.toggle('active', dir === 1); document.getElementById('btn-dir-left').classList.toggle('active', dir === -1); }
  document.getElementById('speed-range').addEventListener('input', (e) => { rotationSpeed = e.target.value / 100; });
  document.getElementById('radius-range').addEventListener('input', (e) => { baseRadius = parseInt(e.target.value, 10); updateResponsiveLayout(); });

  /* --- 背景ネオンハート --- */
  const canvas = document.getElementById('heart-canvas'); const ctx = canvas.getContext('2d');
  let canvasW, canvasH; let hearts = [];
  function resizeCanvas() { 
    canvasW = canvas.width = window.innerWidth; 
    canvasH = canvas.height = window.innerHeight; 
  }
  function createHearts(count) {
    const colors = [{ stroke: '#ff2a6d', glow: '#ff2a6d' }, { stroke: '#ff758c', glow: '#ff7eb3' }, { stroke: '#b537f2', glow: '#d066ff' }];
    hearts = [];
    for (let i = 0; i < count; i++) {
      hearts.push({
        x: Math.random() * canvasW, y: Math.random() * canvasH,
        size: 14 + Math.random() * 22, speedY: 0.3 + Math.random() * 0.6,
        swingSpeed: 0.01 + Math.random() * 0.02, swingRange: 15 + Math.random() * 25,
        angle: Math.random() * Math.PI * 2, color: colors[Math.floor(Math.random() * colors.length)], opacity: 0.25 + Math.random() * 0.55
      });
    }
  }
  function loop() {
    ctx.clearRect(0, 0, canvasW, canvasH);
    hearts.forEach(h => {
      h.y -= h.speedY; h.angle += h.swingSpeed;
      const currentX = h.x + Math.sin(h.angle) * h.swingRange;
      ctx.globalAlpha = h.opacity;
      ctx.save(); ctx.translate(currentX, h.y); ctx.beginPath();
      const tc = h.size * 0.3; ctx.moveTo(0, tc);
      ctx.bezierCurveTo(-h.size / 2, -tc, -h.size, h.size / 3, 0, h.size);
      ctx.bezierCurveTo(h.size, h.size / 3, h.size / 2, -tc, 0, tc);
      ctx.closePath(); ctx.strokeStyle = h.color.stroke; ctx.lineWidth = 1.8; ctx.shadowColor = h.color.glow; ctx.shadowBlur = 14; ctx.stroke(); ctx.restore();
      if (h.y < -40) { h.y = canvasH + 40; h.x = Math.random() * canvasW; }
    });
    requestAnimationFrame(loop);
  }

  /* --- 初期化処理 --- */
  window.addEventListener('resize', () => { resizeCanvas(); updateResponsiveLayout(); });
  window.onload = () => {
    resizeCanvas(); createHearts(20); loop();
    buildCarousel(); updateClock(); renderCalendar();
    
    (async () => {
      await initDB();
      currentImages = await loadImagesFromDB();
      if(currentImages.length > 0) buildCarousel();
      await loadSchedules();
      renderCalendar();
    })();
  };
</script>
</body>
