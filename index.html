<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Neon 3D Carousel</title>

<!-- PWA対応メタタグ -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Carousel">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #060309;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fff;
    position: relative;
  }

  /* 1. すりガラスアンビエント背景 */
  .ambient-bg {
    position: absolute;
    top: -15%; left: -15%;
    width: 130%; height: 130%;
    object-fit: cover;
    filter: blur(70px) brightness(0.3) saturate(1.4);
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.8s ease;
    display: none;
  }

  /* 2. 背景ネオンハート Canvas */
  #heart-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* 3. 3Dメリーゴーランドステージ */
  .carousel-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    z-index: 5;
    overflow: hidden;
  }

  .carousel-cylinder {
    position: relative;
    width: 320px;
    height: 440px;
    transform-style: preserve-3d;
  }

  .carousel-panel {
    position: absolute;
    width: 320px;
    height: 440px;
    border-radius: 14px;
    transform-style: preserve-3d;
    transform-origin: center center;
  }

  /* パネル共通（表・裏）: 透過アクリル調 */
  .panel-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 42, 109, 0.25);
    box-shadow: inset 0 0 15px rgba(255, 42, 109, 0.08), 0 8px 30px rgba(0, 0, 0, 0.5);
    background: rgba(18, 10, 24, 0.15);
    backdrop-filter: blur(2px);
    overflow: hidden;
    padding: 8px;
  }

  .panel-front {
    z-index: 2;
    transform: rotateY(0deg);
  }
  .panel-front img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
  }

  .panel-back {
    transform: rotateY(180deg);
    opacity: 0.4;
    filter: brightness(0.7);
  }
  .panel-back img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    transform: scaleX(-1);
    filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.5));
  }

  /* 未登録時のネオンカード */
  .panel-empty {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: rgba(18, 10, 24, 0.4);
    backdrop-filter: blur(8px);
    border: 2px dashed rgba(255, 42, 109, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: inset 0 0 20px rgba(255, 42, 109, 0.15), 0 0 15px rgba(255, 42, 109, 0.25);
    transition: all 0.3s;
  }
  .panel-empty:hover {
    border-color: #ff2a6d;
    background: rgba(255, 42, 109, 0.12);
    box-shadow: inset 0 0 30px rgba(255, 42, 109, 0.3), 0 0 25px rgba(255, 42, 109, 0.5);
    transform: scale(1.02);
  }
  .panel-empty-icon {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 0 10px #ff2a6d);
  }
  .panel-empty-text {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #ff758c;
    text-shadow: 0 0 8px rgba(255, 42, 109, 0.8);
  }

  /* 4. 時計 */
  .overlay-clock {
    position: absolute;
    top: 28px;
    right: 36px;
    z-index: 10;
    text-align: right;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(255, 42, 109, 0.6);
  }
  .clock-time { font-size: 2.2rem; font-weight: 200; letter-spacing: 0.08em; }
  .clock-date { font-size: 0.72rem; font-weight: 300; letter-spacing: 0.25em; opacity: 0.7; margin-top: 2px; }

  /* 5. ネオンハートメニューボタン */
  .heart-menu-btn {
    position: fixed;
    bottom: 26px;
    right: 28px;
    z-index: 100;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, filter 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(255, 42, 109, 0.6));
  }
  .heart-menu-btn:hover {
    transform: scale(1.15);
    filter: drop-shadow(0 0 14px rgba(255, 42, 109, 1));
  }
  .heart-menu-btn svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 42, 109, 0.15);
    stroke: #ff2a6d;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 6. スライド式サイドメニュー */
  .glass-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 290px;
    height: 100vh;
    background: rgba(12, 8, 16, 0.94);
    backdrop-filter: blur(16px);
    border-left: 1px solid rgba(255, 42, 109, 0.2);
    z-index: 150;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding: 24px 18px;
    gap: 16px;
  }
  .glass-panel.is-open { transform: translateX(0); }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 12px;
  }
  .panel-title { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em; color: #ff2a6d; }
  .close-btn { background: none; border: none; color: #888; font-size: 1.1rem; cursor: pointer; }
  .close-btn:hover { color: #fff; }

  .control-section { display: flex; flex-direction: column; gap: 8px; }
  .control-label { font-size: 0.68rem; color: #8a8190; letter-spacing: 0.1em; text-transform: uppercase; }

  .custom-file-upload {
    display: block;
    width: 100%;
    padding: 10px;
    text-align: center;
    border-radius: 6px;
    border: 1px dashed rgba(255, 42, 109, 0.5);
    background: rgba(255, 42, 109, 0.06);
    color: #ff758c;
    font-size: 0.75rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .custom-file-upload:hover { background: rgba(255, 42, 109, 0.15); }

  /* 一括リセットボタン */
  .reset-images-btn {
    display: block;
    width: 100%;
    padding: 9px;
    text-align: center;
    border-radius: 6px;
    border: 1px solid rgba(255, 75, 75, 0.4);
    background: rgba(255, 75, 75, 0.08);
    color: #ff8080;
    font-size: 0.72rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .reset-images-btn:hover {
    background: rgba(255, 75, 75, 0.25);
    border-color: #ff4b4b;
    box-shadow: 0 0 10px rgba(255, 75, 75, 0.3);
  }

  .switch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    padding: 3px;
    border-radius: 6px;
  }
  .switch-btn {
    background: transparent;
    border: none;
    color: #888;
    font-size: 0.72rem;
    padding: 6px 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .switch-btn.active {
    background: #ff2a6d;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(255, 42, 109, 0.4);
  }

  .range-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #bbb; }
  input[type="range"] {
    appearance: none;
    width: 100%;
    height: 4px;
    background: #231929;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff2a6d;
    box-shadow: 0 0 6px #ff2a6d;
  }
</style>
</head>
<body>

<!-- 1. すりガラスアンビエント背景 -->
<img src="" alt="Ambient" class="ambient-bg" id="ambient-bg">

<!-- 2. ネオンハート Canvas -->
<canvas id="heart-canvas"></canvas>

<!-- 3. 3Dメリーゴーランド -->
<div class="carousel-stage">
  <div class="carousel-cylinder" id="carousel-cylinder"></div>
</div>

<!-- 4. 時計表示 -->
<div class="overlay-clock">
  <div class="clock-time" id="clock-time">00:00</div>
  <div class="clock-date" id="clock-date">2026.09.09 WED</div>
</div>

<!-- 5. ネオンハートメニューボタン -->
<div class="heart-menu-btn" onclick="toggleMenu()" title="Settings">
  <svg viewBox="0 0 32 32">
    <path d="M16 28 C16 28 3 19 3 10 C3 5 7 2 11.5 2 C14.3 2 15.6 3.5 16 4.5 C16.4 3.5 17.7 2 20.5 2 C25 2 29 5 29 10 C29 19 16 28 16 28 Z"/>
  </svg>
</div>

<!-- 隠しファイルインプット -->
<input type="file" id="image-file-input" accept="image/*" multiple style="display: none;">

<!-- 6. 設定パネル -->
<div class="glass-panel" id="glass-panel">
  <div class="panel-header">
    <div class="panel-title">SETTINGS</div>
    <button class="close-btn" onclick="toggleMenu()">✕</button>
  </div>

  <div class="control-section">
    <div class="control-label">Image Source</div>
    <label class="custom-file-upload" for="image-file-input">
      ＋ 画像を追加 (複数選択可)
    </label>
    <button class="reset-images-btn" onclick="resetAllImages()">
      🗑 全ての画像をリセット
    </button>
    <div style="font-size:0.62rem; color:#64748b; text-align:center;">※ブラウザ内に自動保存されます</div>
  </div>

  <div class="control-section">
    <div class="control-label">Rotation Direction</div>
    <div class="switch-grid">
      <button class="switch-btn active" id="btn-dir-right" onclick="setDirection(1)">右から左 ◀</button>
      <button class="switch-btn" id="btn-dir-left" onclick="setDirection(-1)">左から右 ▶</button>
    </div>
  </div>

  <div class="control-section">
    <div class="range-row">
      <span>回転スピード</span>
      <span id="speed-val">標準</span>
    </div>
    <input type="range" id="speed-range" min="5" max="40" value="15">
  </div>

  <div class="control-section">
    <div class="range-row">
      <span>メリーゴーランドの半径</span>
      <span id="radius-val">標準</span>
    </div>
    <input type="range" id="radius-range" min="300" max="850" value="480">
  </div>

  <div class="control-section">
    <div class="range-row">
      <span>ネオンハートの量</span>
      <span id="heart-count-val">20個</span>
    </div>
    <input type="range" id="heart-count-range" min="0" max="50" value="20">
  </div>
</div>

<script>
  /* --- 1. ServiceWorker登録 (PWA) --- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail:', err));
    });
  }

  /* --- 2. IndexedDB 画像ストレージ (大容量永続化) --- */
  const DB_NAME = 'NeonCarouselDB';
  const STORE_NAME = 'images_store';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveImagesToDB(imgs) {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put({ id: 'saved_list', data: imgs });
  }

  async function loadImagesFromDB() {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get('saved_list');
      req.onsuccess = () => resolve(req.result ? req.result.data : []);
      req.onerror = () => resolve([]);
    });
  }

  async function clearDB() {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
  }

  /* --- 3. 時計更新 --- */
  function updateClock() {
    const now = new Date();
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.getElementById('clock-time').textContent = `${hh}:${mm}`;
    document.getElementById('clock-date').textContent = `${y}.${m}.${d} ${days[now.getDay()]}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* --- 4. メニュー開閉 --- */
  const glassPanel = document.getElementById('glass-panel');
  function toggleMenu() {
    glassPanel.classList.toggle('is-open');
  }

  /* --- 5. 3Dメリーゴーランド制御 --- */
  const cylinder = document.getElementById('carousel-cylinder');
  const ambientBg = document.getElementById('ambient-bg');
  const fileInput = document.getElementById('image-file-input');
  const stage = document.querySelector('.carousel-stage');

  let currentImages = [];
  let baseRadius = 480;
  let carouselRadius = 480;
  let rotationAngle = 0;
  let rotationDirection = 1;
  let rotationSpeed = 0.15;

  const heartSvgString = `
    <svg viewBox="0 0 32 32" style="width:100%; height:100%; fill:rgba(255,42,109,0.15); stroke:#ff2a6d; stroke-width:2.2;">
      <path d="M16 28 C16 28 3 19 3 10 C3 5 7 2 11.5 2 C14.3 2 15.6 3.5 16 4.5 C16.4 3.5 17.7 2 20.5 2 C25 2 29 5 29 10 C29 19 16 28 16 28 Z"/>
    </svg>
  `;

  function buildCarousel() {
    cylinder.innerHTML = '';

    if (currentImages.length === 0) {
      ambientBg.style.display = 'none';
      const count = 6;
      for (let idx = 0; idx < count; idx++) {
        const panel = document.createElement('div');
        panel.className = 'carousel-panel';

        const emptyCard = document.createElement('div');
        emptyCard.className = 'panel-empty';
        emptyCard.onclick = () => fileInput.click();
        emptyCard.innerHTML = `
          <div class="panel-empty-icon">${heartSvgString}</div>
          <div class="panel-empty-text">＋ ADD PHOTO</div>
        `;

        panel.appendChild(emptyCard);
        cylinder.appendChild(panel);
      }
      updateResponsiveLayout();
      return;
    }

    ambientBg.src = currentImages[0];
    ambientBg.style.display = 'block';

    let displayList = [...currentImages];
    while (displayList.length < 6) {
      displayList = displayList.concat(currentImages);
    }

    displayList.forEach((src) => {
      const panel = document.createElement('div');
      panel.className = 'carousel-panel';

      const front = document.createElement('div');
      front.className = 'panel-face panel-front';
      const imgFront = document.createElement('img');
      imgFront.src = src;
      front.appendChild(imgFront);

      const back = document.createElement('div');
      back.className = 'panel-face panel-back';
      const imgBack = document.createElement('img');
      imgBack.src = src;
      back.appendChild(imgBack);

      panel.appendChild(front);
      panel.appendChild(back);
      cylinder.appendChild(panel);
    });

    updateResponsiveLayout();
  }

  function updateResponsiveLayout() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    let panelH = Math.round(Math.min(h * 0.52, 460));
    let panelW = Math.round(panelH * (320 / 440));

    if (panelW > w * 0.72) {
      panelW = Math.round(w * 0.72);
      panelH = Math.round(panelW * (440 / 320));
    }

    cylinder.style.width = `${panelW}px`;
    cylinder.style.height = `${panelH}px`;

    const panels = cylinder.querySelectorAll('.carousel-panel');
    panels.forEach(p => {
      p.style.width = `${panelW}px`;
      p.style.height = `${panelH}px`;
    });

    carouselRadius = Math.min(baseRadius, Math.max(160, Math.round(w * 0.38)));

    if (stage) {
      stage.style.perspective = `${Math.max(650, Math.round(w * 1.0))}px`;
    }

    if (panels.length > 0) {
      const angleStep = 360 / panels.length;
      panels.forEach((p, idx) => {
        const angle = angleStep * idx;
        p.style.transform = `rotateY(${angle}deg) translateZ(${carouselRadius}px)`;
      });
    }
  }

  function animateCarousel() {
    rotationAngle += rotationSpeed * rotationDirection;
    cylinder.style.transform = `rotateY(${rotationAngle}deg)`;
    requestAnimationFrame(animateCarousel);
  }
  requestAnimationFrame(animateCarousel);

  /* --- 6. 画像読み込み＆保存 --- */
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length > 0) {
      currentImages = [];
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          currentImages.push(ev.target.result);
          loaded++;
          if (loaded === files.length) {
            saveImagesToDB(currentImages); // IndexedDBに保存
            buildCarousel();
          }
        };
        reader.readAsDataURL(file);
      });
    }
  });

  /* 一括リセット機能 */
  async function resetAllImages() {
    if (confirm('登録した画像をすべてリセットしますか？')) {
      await clearDB();
      currentImages = [];
      fileInput.value = '';
      buildCarousel();
    }
  }

  /* --- 7. コントロール操作 --- */
  function setDirection(dir) {
    rotationDirection = dir;
    document.getElementById('btn-dir-right').classList.toggle('active', dir === 1);
    document.getElementById('btn-dir-left').classList.toggle('active', dir === -1);
  }

  const speedRange = document.getElementById('speed-range');
  speedRange.addEventListener('input', (e) => {
    rotationSpeed = e.target.value / 100;
  });

  const radiusRange = document.getElementById('radius-range');
  radiusRange.addEventListener('input', (e) => {
    baseRadius = parseInt(e.target.value, 10);
    updateResponsiveLayout();
  });

  /* --- 8. ネオンハートアニメーション --- */
  const canvas = document.getElementById('heart-canvas');
  const ctx = canvas.getContext('2d');
  let canvasW, canvasH;

  function resizeCanvas() {
    canvasW = canvas.width = window.innerWidth;
    canvasH = canvas.height = window.innerHeight;
  }

  function drawHeart(ctx, x, y, size, color, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    const topCurve = size * 0.3;
    ctx.moveTo(0, topCurve);
    ctx.bezierCurveTo(-size / 2, -topCurve, -size, size / 3, 0, size);
    ctx.bezierCurveTo(size, size / 3, size / 2, -topCurve, 0, topCurve);
    ctx.closePath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.restore();
  }

  const colors = [
    { stroke: '#ff2a6d', glow: '#ff2a6d' },
    { stroke: '#ff758c', glow: '#ff7eb3' },
    { stroke: '#b537f2', glow: '#d066ff' }
  ];

  let hearts = [];
  function createHearts(count) {
    hearts = [];
    for (let i = 0; i < count; i++) {
      hearts.push({
        x: Math.random() * canvasW,
        y: Math.random() * canvasH,
        size: 14 + Math.random() * 22,
        speedY: 0.3 + Math.random() * 0.6,
        swingSpeed: 0.01 + Math.random() * 0.02,
        swingRange: 15 + Math.random() * 25,
        angle: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        opacity: 0.25 + Math.random() * 0.55
      });
    }
  }

  const heartCountRange = document.getElementById('heart-count-range');
  const heartCountVal = document.getElementById('heart-count-val');
  heartCountRange.addEventListener('input', (e) => {
    heartCountVal.textContent = `${e.target.value}個`;
    createHearts(parseInt(e.target.value, 10));
  });

  function loop() {
    ctx.clearRect(0, 0, canvasW, canvasH);
    hearts.forEach(h => {
      h.y -= h.speedY;
      h.angle += h.swingSpeed;
      const currentX = h.x + Math.sin(h.angle) * h.swingRange;

      ctx.globalAlpha = h.opacity;
      drawHeart(ctx, currentX, h.y, h.size, h.color.stroke, h.color.glow);

      if (h.y < -40) {
        h.y = canvasH + 40;
        h.x = Math.random() * canvasW;
      }
    });
    requestAnimationFrame(loop);
  }

  /* --- 初期起動処理 --- */
  (async () => {
    resizeCanvas();
    createHearts(20);
    loop();

    // 以前登録した画像があれば復元
    currentImages = await loadImagesFromDB();
    buildCarousel();

    window.addEventListener('resize', () => {
      resizeCanvas();
      updateResponsiveLayout();
    });
  })();
</script>
</body>
</html>
